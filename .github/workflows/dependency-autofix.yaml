# Companion auto-fix for the dependency canary. dependency-check.yaml installs
# and executes the development heads of the package's dependencies, which is
# untrusted code, so that workflow runs under a read-only token. The write
# permissions live here instead: when the check finishes red, this workflow
# asks Claude Code to reproduce the breakage and open a pull request with the
# smallest safe fix. Reproducing the failure means dependency code runs in this
# job too, beside the write token; that trade-off is accepted because the job
# is inert until the maintainer opts in by adding a CLAUDE_CODE_OAUTH_TOKEN or
# ANTHROPIC_API_KEY secret, runs only after a failed check rather than on every
# schedule, and produces a reviewable pull request rather than an unattended
# push to main. The action works with this run's GITHUB_TOKEN, which needs the
# repository setting "Allow GitHub Actions to create and approve pull requests"
# (Settings > Actions > General) before it can open a pull request. Workflows do
# not start on their own for a pull request opened with that token. The
# maintainer therefore runs R-CMD-check on its branch before merging, from the
# Actions tab or by closing and reopening the pull request. If the attempt
# fails, the run says so on the open dependency issue and finishes red.
on:
  workflow_run:
    workflows: ["dependency-check.yaml"]
    types: [completed]
  workflow_dispatch:

name: dependency-autofix.yaml

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  dependency-autofix:
    # A manual dispatch always runs (useful for testing the plumbing); the
    # scheduled path only reacts to a failed dependency check.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      # Evaluates to the string "true" only when a Claude credential is
      # configured; the secret values themselves are never exposed. A Claude
      # subscription OAuth token (CLAUDE_CODE_OAUTH_TOKEN) drives the fix at no
      # API cost; an ANTHROPIC_API_KEY is the paid alternative. Without either,
      # every step below skips and the dependency-check issue remains the sole
      # means of flagging the maintainer.
      HAS_CLAUDE: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' || secrets.ANTHROPIC_API_KEY != '' }}
      # The canary's check step runs with CRAN's incoming checks off (see
      # dependency-check.yaml), so the check that the prompt asks Claude to run
      # reaches the same verdict as the canary.
      _R_CHECK_CRAN_INCOMING_: "false"

    steps:
      - uses: actions/checkout@v7
        if: env.HAS_CLAUDE == 'true'
        with:
          fetch-depth: 0

      - name: Configure git for the fix branch
        if: env.HAS_CLAUDE == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        if: env.HAS_CLAUDE == 'true'

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        if: env.HAS_CLAUDE == 'true'
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        if: env.HAS_CLAUDE == 'true'
        with:
          extra-packages: any::rcmdcheck, any::devtools
          needs: check

      - name: Install development versions of the key dependencies
        # The same development heads the canary checks against, so that the
        # failure reproduces here rather than vanishing under the released
        # versions.
        if: env.HAS_CLAUDE == 'true'
        continue-on-error: true
        shell: Rscript {0}
        run: |
          pak::pak(c(
            "r-lib/httr2", "r-lib/cli", "r-lib/rlang",
            "tidyverse/tibble", "jeroen/jsonlite", "tidyverse/ggplot2"
          ), ask = FALSE)

      - name: Attempt an automatic fix (Claude)
        id: claude
        if: env.HAS_CLAUDE == 'true'
        # Kept so that the report step below still runs after a failure. The
        # report step decides the run's conclusion.
        continue-on-error: true
        # Pinned to a full commit SHA because anthropics/ is outside the small
        # set of publishers this family trusts to float on a major tag.
        uses: anthropics/claude-code-action@ae68417a745a5df4b2124873632bd73a2255e6f6 # v1.0.259
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Without a token here, the action exchanges an OIDC token for the
          # Claude GitHub App's token, which needs id-token: write and the app
          # installed. Without this line, every run from 2026-08-23 failed at
          # that exchange. GITHUB_TOKEN carries the permissions declared above
          # and needs the repository setting named in the header comment.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            The scheduled dependency check for this R package (scopusflow) is
            failing, most likely because an updated dependency introduced a
            breaking change. The development versions of the key dependencies
            (httr2, cli, rlang, tibble, jsonlite, ggplot2) are already installed
            in this environment.

            Please:
              1. Reproduce the failure by running
                 Rscript -e 'rcmdcheck::rcmdcheck(args = c("--no-manual", "--as-cran"), error_on = "never")'
                 and read the relevant files under R/ and tests/.
              2. Make the smallest change that restores compatibility with the
                 updated dependency, preserving behaviour and the package's
                 conventions (typed conditions via rlang::abort, British spelling,
                 offline tests).
              3. Run Rscript -e 'devtools::test()' to confirm the fix.
              4. Open a pull request from a new branch named
                 fix/dependency-canary-${{ github.run_number }} with a clear title
                 and a description of what broke and how you fixed it, using:
                 gh pr create --base main --head <branch> --title "..." --body "...".

            If the failure cannot be resolved safely without a larger redesign,
            do not force a change: instead summarise the cause and the options
            in a comment on the open issue titled "Scheduled dependency check
            is failing".

            Do not edit files under .github/ and do not bump the package version.
          claude_args: >-
            --max-turns 25
            --allowedTools "Bash(git:*),Bash(gh:*),Bash(Rscript:*),Bash(R:*),Edit,Read,Write"

      - name: Report a failed fix attempt
        # continue-on-error above turns a failed action into a green run, which
        # hid 21 consecutive failures. This step comments on the open
        # dependency issue if there is one and ends the run red.
        if: env.HAS_CLAUDE == 'true' && steps.claude.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Scheduled dependency check is failing"
          existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "The automatic fix attempt failed before it produced a pull request: $RUN_URL"
          fi
          exit 1
