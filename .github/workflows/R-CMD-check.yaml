# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # Windows on R-devel is the combination win-builder checks, and the one
          # the rest of this matrix leaves uncovered (Windows is otherwise only
          # on release, R-devel only on Linux). Running it here gives the same
          # signal on every push, rather than by email after an upload.
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          # DESCRIPTION promises R (>= 4.1.0), four minor versions below
          # oldrel-1. These two legs reach down to R 4.3, and the r-minimum job
          # below runs the tests on R 4.1 itself.
          - {os: ubuntu-latest,  r: 'oldrel-2'}
          - {os: ubuntu-latest,  r: 'oldrel-3'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

      # CRAN's r-devel-linux-x86_64-debian-clang flavour runs its checks in a
      # Latin-9 locale (en_US.iso885915), and every leg above runs in UTF-8.
      # There a string not marked as UTF-8 is read as Latin-9, which no UTF-8
      # leg can show, so the Linux R-devel leg runs the tests once more in that
      # locale, with NOT_CRAN unset, as CRAN runs them. The first line of the R
      # code stops the step if the locale did not take.
      - name: Tests in a Latin-9 locale, as on CRAN's Debian clang flavour
        if: runner.os == 'Linux' && matrix.config.r == 'devel'
        shell: bash
        run: |
          sudo localedef -i en_US -f ISO-8859-15 en_US.iso885915
          env -u NOT_CRAN LANG=en_US.iso885915 LC_ALL=en_US.iso885915 Rscript -e '
            stopifnot(identical(l10n_info()$codeset, "ISO-8859-15"))
            pkgload::load_all(".", quiet = TRUE)
            invisible(testthat::test_dir("tests/testthat", stop_on_failure = TRUE))
          '

  # Verify the package works with ONLY its declared strong dependencies on the
  # path, so that nothing in R/, the examples or the tests silently relies on a
  # Suggests or transitive package. Examples and tests that use a Suggest guard
  # themselves with @examplesIf, requireNamespace() or skip_if_not_installed().
  # Vignettes are skipped here because rmarkdown (the output format) is a Suggest
  # and so is absent under depends-only. The matrix job above builds and checks
  # the vignettes in full.
  depends-only:
    runs-on: ubuntu-latest
    name: depends-only
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_DEPENDS_ONLY_: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          # Build the vignettes normally (R CMD build sees the full library), but
          # skip RE-building them during the depends-only check, where rmarkdown
          # is absent.
          args: 'c("--no-manual", "--as-cran", "--no-vignettes")'
          build_args: 'c("--no-manual")'

  # The version floors in DESCRIPTION are a promise to users that the matrix
  # above never tests: setup-r-dependencies always resolves the newest version,
  # so the httr2 floor had never once been exercised. This job installs it and
  # runs the check against it, turning the floor into something asserted rather
  # than asserted-about.
  #
  # Only httr2 is pinned. It is the dependency whose API this package leans on
  # hardest (`.redact` in req_headers(), `retry_on_failure`, `is_transient` and
  # `after` in req_retry(), req_timeout(), and local_mocked_responses()
  # throughout the test suite), and pinning it alone avoids dragging the rest of
  # the library backwards, which would fail the job for reasons that have
  # nothing to do with scopusflow. The floor is 1.0.4, the first release with
  # `retry_on_failure`. rlang is asserted rather than pinned: httr2 declares
  # `rlang (>= 1.1.0)` itself, so nothing can install this package with rlang
  # below that, and DESCRIPTION now says so.
  min-deps:
    runs-on: ubuntu-latest
    name: min-deps (declared floors)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install the declared dependency floors
        shell: Rscript {0}
        run: |
          pak::pak("httr2@1.0.4", ask = FALSE)

      - name: Assert the floors are what is actually installed
        # Without this the job is the always-green hazard in miniature: a pin
        # that silently did not take would leave the check running against the
        # current releases and passing, having proved nothing about the floors.
        shell: Rscript {0}
        run: |
          floors <- c(httr2 = "1.0.4", rlang = "1.1.0")
          have <- vapply(names(floors), function(p) as.character(packageVersion(p)),
                         character(1))
          print(data.frame(package = names(floors), declared = unname(floors),
                           installed = unname(have)))
          if (!identical(have[["httr2"]], floors[["httr2"]])) {
            cat(sprintf(
              "::error::httr2 %s is installed, not the declared floor %s. The pin did not take, so this job proves nothing about the floor.\n",
              have[["httr2"]], floors[["httr2"]]
            ))
            quit(status = 1)
          }
          if (package_version(have[["rlang"]]) < package_version(floors[["rlang"]])) {
            cat(sprintf(
              "::error::rlang %s is below the floor DESCRIPTION declares (%s).\n",
              have[["rlang"]], floors[["rlang"]]
            ))
            quit(status = 1)
          }

      - uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          args: 'c("--no-manual", "--no-vignettes")'
          build_args: 'c("--no-manual")'

  # A NAMESPACE that has drifted from the roxygen tags is invisible to the test
  # suite, because testthat runs inside the package namespace, where an object
  # that lost its export() still resolves. The dropped export reaches users and
  # nobody else. A help page that has drifted from its roxygen comment is
  # invisible to every check, and it is what CRAN publishes. Regenerating
  # NAMESPACE and man/ here and diffing them against the committed files is
  # the only check in this repository that can see either.
  #
  # Rd formatting changes between roxygen2 releases, so roxygen2 is pinned
  # below, and the job fails if DESCRIPTION records another version. A
  # roxygen2 release therefore cannot turn this job red with no change to the
  # sources. The help is regenerated in a UTF-8 locale, since a default
  # argument holding a non-ASCII character is written differently in any
  # other. This job stays out of the matrix above, where eight platform legs
  # would establish the same fact eight times, and a red cell there would read
  # as a platform fault rather than as a document() that was never run.
  namespace:
    runs-on: ubuntu-latest
    name: namespace and man/ (committed vs regenerated)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          use-public-rspm: true

      # roxygen2 loads the package in order to read its tags, so the package's
      # own dependencies have to be installed before it can run at all.
      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0

      - name: Install the pinned roxygen2
        # Pinned so that a roxygen2 release cannot turn this job red with no
        # change to the sources. Raise the pin and re-run devtools::document()
        # in the same commit.
        shell: Rscript {0}
        run: |
          pak::pak("roxygen2@8.0.0", ask = FALSE)

      - name: Report the roxygen2 version and check it against DESCRIPTION
        # DESCRIPTION records the version that last wrote NAMESPACE. If a
        # different one is installed, the diff below would show that gap rather
        # than a stale file, so name the cause instead of leaving the next
        # reader to work it out. This also catches a pin that failed to take,
        # which would otherwise leave the job checking something other than what
        # it claims to check.
        shell: Rscript {0}
        run: |
          have <- as.character(packageVersion("roxygen2"))
          d <- read.dcf("DESCRIPTION")
          field <- intersect(c("Config/roxygen2/version", "RoxygenNote"), colnames(d))
          want <- if (length(field)) unname(d[1, field[1]]) else NA_character_
          cat(sprintf("roxygen2 installed: %s\n", have))
          cat(sprintf("DESCRIPTION %s: %s\n",
                      if (length(field)) field[1] else "(no roxygen2 version recorded)",
                      if (is.na(want)) "-" else want))
          if (!is.na(want) && !identical(have, want)) {
            cat(sprintf(
              "::error file=DESCRIPTION::roxygen2 %s is installed but DESCRIPTION records %s, so any difference in NAMESPACE or man/ below would be that version gap and not a stale file. Either raise the pin in .github/workflows/R-CMD-check.yaml to %s, or re-run devtools::document() under %s and commit DESCRIPTION, NAMESPACE and man/ together.\n",
              have, want, want, have))
            quit(status = 1)
          }

      - name: Confirm NAMESPACE carries the roxygen header
        # roxygenise() leaves a NAMESPACE it did not write alone, and says so
        # only in passing. A file that lost the header would therefore keep the
        # diff below clean however stale it had become, and this job would pass
        # by never having run. That is the failure that prompted the job, so it
        # is asserted rather than assumed.
        run: |
          head -n 1 NAMESPACE
          if ! head -n 1 NAMESPACE | grep -q '^# Generated by roxygen2'; then
            echo "::error file=NAMESPACE::NAMESPACE has no 'Generated by roxygen2' header, so roxygenise() will not rewrite it and this job cannot see drift. Delete NAMESPACE, run devtools::document() to regenerate it with the header, and commit the result."
            exit 1
          fi

      - name: Regenerate NAMESPACE and man/ from the roxygen comments
        # The namespace and rd roclets, without collate, which this package
        # does not use.
        shell: Rscript {0}
        env:
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: |
          roxygen2::roxygenise(".", roclets = c("namespace", "rd"))

      - name: Compare the regenerated NAMESPACE and man/ with the committed files
        # The diff and any new Rd file are printed to the log, so that the
        # change can be read from the run without downloading anything.
        run: |
          changes=$(git status --porcelain --untracked-files=all -- NAMESPACE man)
          if [ -n "$changes" ]; then
            echo "$changes"
            git --no-pager diff -- NAMESPACE man
            git ls-files --others --exclude-standard -- man | while read -r f; do
              echo "New file $f:"
              cat "$f"
            done
            echo "::error::NAMESPACE or man/ is out of date with the roxygen comments in R/. The diff above is what roxygen2 would have written. Run devtools::document() and commit NAMESPACE and man/."
            exit 1
          fi
          echo "NAMESPACE and man/ match the roxygen comments in R/."

  # DESCRIPTION declares `R (>= 4.1.0)`, and the matrix above reaches down to
  # R 4.3 only, so this job runs the test suite on R 4.1 itself (setup-r
  # installs 4.1.3, the last release of R 4.1). It tests that the code runs on
  # the oldest R series the package promises. It does not run
  # R CMD check --as-cran, since CRAN no longer checks R 4.1. The strong
  # dependencies are installed with testthat and pkgload, which bring the
  # suggested callr and withr with them. The tests that need another suggested
  # package, such as ggplot2 or shiny, skip themselves, as depends-only shows.
  r-minimum:
    name: R (declared minimum, 4.1)
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: r-lib/actions/setup-r@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          r-version: '4.1'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05  # v2.14.0
        with:
          dependencies: '"hard"'
          extra-packages: any::testthat, any::pkgload

      - name: Tests
        shell: Rscript {0}
        run: |
          cat(R.version.string, "\n")
          pkgload::load_all(".", quiet = TRUE)
          res <- testthat::test_dir("tests/testthat", stop_on_failure = TRUE)
          invisible(res)
