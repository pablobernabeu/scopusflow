# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          # Windows on R-devel is the combination win-builder checks, and the one
          # the rest of this matrix leaves uncovered (Windows is otherwise only
          # on release, R-devel only on Linux). Running it here gives the same
          # signal on every push, rather than by email after an upload.
          - {os: windows-latest, r: 'devel'}
          - {os: ubuntu-latest,  r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,  r: 'release'}
          - {os: ubuntu-latest,  r: 'oldrel-1'}
          # DESCRIPTION promises R (>= 4.1.0). oldrel-1 alone sits four minor
          # versions above that, so the claim went untested; these two reach
          # down to roughly R 4.3. The remaining gap to 4.1 is noted in
          # dev/design-notes.md.
          - {os: ubuntu-latest,  r: 'oldrel-2'}
          - {os: ubuntu-latest,  r: 'oldrel-3'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

  # Verify the package works with ONLY its declared strong dependencies on the
  # path, so that nothing in R/, the examples or the tests silently relies on a
  # Suggests or transitive package. Examples and Suggests-using tests guard
  # themselves with @examplesIf / requireNamespace() / skip_if_not_installed().
  # Vignettes are skipped here because rmarkdown (the output format) is a Suggest
  # and so is absent under depends-only; the vignettes are built and checked in
  # full by the matrix job above.
  depends-only:
    runs-on: ubuntu-latest
    name: depends-only
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      _R_CHECK_DEPENDS_ONLY_: true
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          # Build the vignettes normally (R CMD build sees the full library), but
          # skip RE-building them during the depends-only check, where rmarkdown
          # is absent.
          args: 'c("--no-manual", "--as-cran", "--no-vignettes")'
          build_args: 'c("--no-manual")'

  # The version floors in DESCRIPTION are a promise to users that the matrix
  # above never tests: setup-r-dependencies always resolves the newest version,
  # so httr2 1.0.0 had never once been exercised. This job installs it and runs
  # the check against it, turning the floor into something asserted rather than
  # asserted-about.
  #
  # Only httr2 is pinned. It is the dependency whose API this package leans on
  # hardest (`.redact` in req_headers(), `is_transient` and `after` in
  # req_retry(), req_timeout(), and local_mocked_responses() throughout the test
  # suite), and pinning it alone avoids dragging the rest of the library
  # backwards, which would fail the job for reasons that have nothing to do with
  # scopusflow. rlang is asserted rather than pinned: httr2 1.0.0 declares
  # `rlang (>= 1.1.0)` itself, so nothing can install this package with rlang
  # below that, and DESCRIPTION now says so.
  min-deps:
    runs-on: ubuntu-latest
    name: min-deps (declared floors)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - name: Install the declared dependency floors
        shell: Rscript {0}
        run: |
          pak::pak("httr2@1.0.0", ask = FALSE)

      - name: Assert the floors are what is actually installed
        # Without this the job is the always-green hazard in miniature: a pin
        # that silently did not take would leave the check running against the
        # current releases and passing, having proved nothing about the floors.
        shell: Rscript {0}
        run: |
          floors <- c(httr2 = "1.0.0", rlang = "1.1.0")
          have <- vapply(names(floors), function(p) as.character(packageVersion(p)),
                         character(1))
          print(data.frame(package = names(floors), declared = unname(floors),
                           installed = unname(have)))
          if (!identical(have[["httr2"]], floors[["httr2"]])) {
            cat(sprintf(
              "::error::httr2 %s is installed, not the declared floor %s. The pin did not take, so this job proves nothing about the floor.\n",
              have[["httr2"]], floors[["httr2"]]
            ))
            quit(status = 1)
          }
          if (package_version(have[["rlang"]]) < package_version(floors[["rlang"]])) {
            cat(sprintf(
              "::error::rlang %s is below the floor DESCRIPTION declares (%s).\n",
              have[["rlang"]], floors[["rlang"]]
            ))
            quit(status = 1)
          }

      - uses: r-lib/actions/check-r-package@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          args: 'c("--no-manual", "--no-vignettes")'
          build_args: 'c("--no-manual")'

  # A NAMESPACE that has drifted from the roxygen tags is invisible to the test
  # suite, because testthat runs inside the package namespace, where an object
  # that lost its export() still resolves. The dropped export reaches users and
  # nobody else. Regenerating NAMESPACE here and diffing it against the
  # committed copy is the only check in this repository that can see it.
  #
  # NAMESPACE only, deliberately. Rd formatting churns between roxygen2
  # releases, so gating man/ would report a version gap as though it were a
  # stale file and leave the job flaky. Keeping this out of the matrix above is
  # the same judgement: eight platform legs would establish the same fact eight
  # times, and a red cell there reads as a platform fault rather than as a
  # document() that was never run.
  namespace:
    runs-on: ubuntu-latest
    name: namespace (committed vs regenerated)
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          use-public-rspm: true

      # roxygen2 loads the package in order to read its tags, so the package's
      # own dependencies have to be installed before it can run at all.
      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1

      - name: Install the pinned roxygen2
        # Pinned so that a roxygen2 release cannot turn this job red with no
        # change to the sources. Raise the pin and re-run devtools::document()
        # in the same commit.
        shell: Rscript {0}
        run: |
          pak::pak("roxygen2@8.0.0", ask = FALSE)

      - name: Report the roxygen2 version and check it against DESCRIPTION
        # DESCRIPTION records the version that last wrote NAMESPACE. If a
        # different one is installed, the diff below would show that gap rather
        # than a stale file, so name the cause instead of leaving the next
        # reader to work it out. This also catches a pin that failed to take,
        # which would otherwise leave the job checking something other than what
        # it claims to check.
        shell: Rscript {0}
        run: |
          have <- as.character(packageVersion("roxygen2"))
          d <- read.dcf("DESCRIPTION")
          field <- intersect(c("Config/roxygen2/version", "RoxygenNote"), colnames(d))
          want <- if (length(field)) unname(d[1, field[1]]) else NA_character_
          cat(sprintf("roxygen2 installed: %s\n", have))
          cat(sprintf("DESCRIPTION %s: %s\n",
                      if (length(field)) field[1] else "(no roxygen2 version recorded)",
                      if (is.na(want)) "-" else want))
          if (!is.na(want) && !identical(have, want)) {
            cat(sprintf(
              "::error file=DESCRIPTION::roxygen2 %s is installed but DESCRIPTION records %s, so any NAMESPACE difference below would be that version gap and not a stale file. Either raise the pin in .github/workflows/R-CMD-check.yaml to %s, or re-run devtools::document() under %s and commit DESCRIPTION and NAMESPACE together.\n",
              have, want, want, have))
            quit(status = 1)
          }

      - name: Confirm NAMESPACE carries the roxygen header
        # roxygenise() leaves a NAMESPACE it did not write alone, and says so
        # only in passing. A file that lost the header would therefore keep the
        # diff below clean however stale it had become, and this job would pass
        # by never having run. That is the failure that prompted the job, so it
        # is asserted rather than assumed.
        run: |
          head -n 1 NAMESPACE
          if ! head -n 1 NAMESPACE | grep -q '^# Generated by roxygen2'; then
            echo "::error file=NAMESPACE::NAMESPACE has no 'Generated by roxygen2' header, so roxygenise() will not rewrite it and this job cannot see drift. Delete NAMESPACE, run devtools::document() to regenerate it with the header, and commit the result."
            exit 1
          fi

      - name: Regenerate NAMESPACE from the roxygen tags
        # roclets = "namespace" rather than the default set, so that man/ is
        # left untouched and only the export list is under test.
        shell: Rscript {0}
        run: |
          roxygen2::roxygenise(".", roclets = "namespace")

      - name: Compare the regenerated NAMESPACE with the committed one
        run: |
          if ! git diff --exit-code -- NAMESPACE; then
            echo "::error file=NAMESPACE::NAMESPACE is out of date with the @export tags in R/. The diff above is what roxygen2 would have written. Run devtools::document() and commit the updated NAMESPACE."
            exit 1
          fi
          echo "NAMESPACE matches the @export tags in R/."
