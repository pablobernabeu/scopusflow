# Reports test coverage on each push and pull request, writing the percentage to
# the run summary, and fails the run below the floor. It uses no external service
# (no Codecov), so it needs no token and adds no badge that could rot. The
# reactive app in R/run-app.R is left out of the figure through .covrignore: its
# retrieval runs in a background callr process, so most of the file is out of
# reach of the offline suite and a percentage that includes it describes the
# runner rather than the code the suite tests.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

name: test-coverage.yaml

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6  # v2.12.1
        with:
          extra-packages: any::covr
          needs: check

      - name: Measure and report coverage
        shell: Rscript {0}
        run: |
          cov <- covr::package_coverage(quiet = FALSE)
          pct <- round(covr::percent_coverage(cov), 1)
          cat(sprintf("Test coverage: %s%%\n", pct))
          summary <- Sys.getenv("GITHUB_STEP_SUMMARY")
          if (nzchar(summary)) {
            cat(sprintf("## Test coverage: **%s%%**\n", pct),
                file = summary, append = TRUE)
          }
          min_pct <- 90
          if (pct < min_pct) {
            cat(sprintf("::error::Test coverage is %s%%, below the %s%% floor\n",
                        pct, min_pct))
            quit(status = 1L)
          }
